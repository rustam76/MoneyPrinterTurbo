services:
  webui:
    image: ghcr.io/harry0703/moneyprinterturbo:latest
    container_name: moneyprinterturbo-webui
    ports:
      - "${MPT_WEBUI_HOST:-127.0.0.1}:${MPT_WEBUI_PORT:-8501}:${MPT_WEBUI_CONTAINER_PORT:-8501}"
    environment:
      MPT_AUTH_ENABLED: ${MPT_AUTH_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      MPT_SESSION_SECRET: ${MPT_SESSION_SECRET:-}
      MPT_SESSION_EXPIRE_HOURS: ${MPT_SESSION_EXPIRE_HOURS:-24}
      MPT_COOKIE_SECURE: ${MPT_COOKIE_SECURE:-false}
      MPT_PUBLIC_API_URL: ${MPT_PUBLIC_API_URL:-}
      MPT_PUBLIC_WEBUI_URL: ${MPT_PUBLIC_WEBUI_URL:-}
    command:
      - streamlit
      - run
      - ./webui/Main.py
      - "--server.address=0.0.0.0"
      - "--server.port=${MPT_WEBUI_CONTAINER_PORT:-8501}"
      - "--browser.serverAddress=${MPT_WEBUI_HOST:-127.0.0.1}"
      - "--server.enableCORS=True"
      - "--browser.gatherUsageStats=False"
      - "--client.toolbarMode=minimal"
      - "--logger.hideWelcomeMessage=True"
      - "--server.showEmailPrompt=False"
    volumes:
      - "./storage:/MoneyPrinterTurbo/storage"
    restart: always

  api:
    image: ghcr.io/harry0703/moneyprinterturbo:latest
    container_name: moneyprinterturbo-api
    ports:
      - "${MPT_API_HOST:-127.0.0.1}:${MPT_API_PORT:-8081}:${MPT_API_CONTAINER_PORT:-8080}"
    environment:
      MPT_AUTH_ENABLED: ${MPT_AUTH_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      MPT_SESSION_SECRET: ${MPT_SESSION_SECRET:-}
      MPT_SESSION_EXPIRE_HOURS: ${MPT_SESSION_EXPIRE_HOURS:-24}
      MPT_COOKIE_SECURE: ${MPT_COOKIE_SECURE:-false}
      MPT_PUBLIC_API_URL: ${MPT_PUBLIC_API_URL:-}
      MPT_PUBLIC_WEBUI_URL: ${MPT_PUBLIC_WEBUI_URL:-}
    command:
      - python3
      - main.py
    volumes:
      - "./storage:/MoneyPrinterTurbo/storage"
    restart: always
