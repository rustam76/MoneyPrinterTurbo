# GPU override file
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Prerequisites:
#   1. NVIDIA GPU driver installed on host
#   2. NVIDIA Container Toolkit installed
#   3. Verify with: docker info | grep nvidia
#
# This file overrides the default docker-compose.yml to:
#   - Build with Dockerfile.gpu (NVIDIA CUDA base image)
#   - Attach GPU devices to both services because video generation can run in
#     either the WebUI process or the API process
#
# Ports / hosts are inherited from docker-compose.yml via env:
#   MPT_WEBUI_HOST, MPT_WEBUI_PORT, MPT_WEBUI_CONTAINER_PORT
#   MPT_API_HOST, MPT_API_PORT, MPT_API_CONTAINER_PORT
services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "${MPT_WEBUI_HOST:-127.0.0.1}:${MPT_WEBUI_PORT:-8501}:${MPT_WEBUI_CONTAINER_PORT:-8501}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  api:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "${MPT_API_HOST:-127.0.0.1}:${MPT_API_PORT:-8081}:${MPT_API_CONTAINER_PORT:-8080}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
